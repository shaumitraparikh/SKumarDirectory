name: Deploy catalogs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js for commerce tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install catalog build dependency
        run: python -m pip install jinja2 python-docx Pillow

      - name: Build catalogs
        run: python src/build_catalog.py
        env:
          CATALOG_NO_BROWSER: "1"

      - name: Test catalog data and generated pages
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test commerce calculations and order payloads
        run: node tests/order_core.test.js

      - name: Test customer directory behavior
        run: node tests/client_directory.test.js

      - name: Test bill archive behavior
        run: node tests/bill_archive.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp photo_catalog.html _site/photo_catalog.html
          cp print_catalog.html _site/print_catalog.html
          cp index.html _site/search_catalog.html
          cp index.html _site/customer_catalog.html
          [ -f Google_Review_QR.pdf ] && cp Google_Review_QR.pdf _site/Google_Review_QR.pdf || true
          cp -R app _site/app
          cp -R images _site/images
          mkdir -p _site/data
          cp data/config.json _site/data/
          cp data/catalog_data.csv _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  one-click-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install catalog and source audit dependencies
        run: python -m pip install jinja2 python-docx Pillow

      - name: Run update smoke test
        shell: pwsh
        run: |
          git switch -C main $env:GITHUB_SHA
          ./tests/run_one_click_smoke.ps1
