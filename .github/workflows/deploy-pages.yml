name: Deploy catalogs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js for commerce tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install catalog build dependency
        run: python -m pip install jinja2

      - name: Build catalogs
        run: python build_catalog.py

      - name: Test catalog data and generated pages
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test commerce calculations and order payloads
        run: node tests/order_core.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp print_catalog.html _site/print_catalog.html
          cp search_catalog.html _site/search_catalog.html
          cp -R assets _site/assets
          cp -R images _site/images

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
