<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S. Kumar & Bros - Digital Catalogs</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
    }
    .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 90%;
    }
    h1 {
        color: #000080;
        margin-top: 0;
    }
    p {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.5;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        background-color: #000080;
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        border-radius: 8px;
        transition: background-color 0.2s, transform 0.1s;
        box-sizing: border-box;
    }
    .btn:hover {
        background-color: #000050;
    }
    .btn:active {
        transform: scale(0.98);
    }
    .btn-secondary {
        background-color: #28a745;
    }
    .btn-secondary:hover {
        background-color: #218838;
    }
</style>
</head>
