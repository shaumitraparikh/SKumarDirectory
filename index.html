<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S. Kumar & Bros - Digital Catalogs</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
    }
    .container {
        background: white;
        padding: clamp(22px, 6vw, 40px);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 500px;
        width: min(500px, 100%);
        box-sizing: border-box;
    }
    h1 {
        color: #000080;
        margin-top: 0;
    }
    p {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.5;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        background-color: #000080;
        color: white;
        text-decoration: none;
        font-size: clamp(15px, 4vw, 18px);
        font-weight: bold;
        line-height: 1.25;
        border-radius: 8px;
        transition: background-color 0.2s, transform 0.1s;
        box-sizing: border-box;
    }
    .btn:hover {
        background-color: #000050;
    }
    .btn:active {
        transform: scale(0.98);
    }
    .btn-secondary {
        background-color: #28a745;
    }
    .btn-secondary:hover {
        background-color: #218838;
    }
</style>
</head>
<body>

<div class="container">
    <h1>S. Kumar & Bros</h1>
    <p>INSULATING - ELECTRICALS - ELECTRONIC - HARDWARE - MATERIALS<br><br>Welcome to our digital catalogs. Please select a version below:</p>
    
    <a href="search_catalog.html" class="btn">🛒 Interactive Search & POS Catalog</a>
    <a href="print_catalog.html" class="btn btn-secondary">📄 Compact Print Catalog (Price List)</a>

    <a href="search_catalog.html?edit=true" class="btn" id="sellerLink" style="display:none; background-color: #d97706; margin-top: 30px;">&#x270F;&#xFE0F; Seller Workspace (Edit Mode)</a>
</div>

<script>
    if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        document.getElementById('sellerLink').style.display = 'block';
    }
</script>


</body>
</html>
