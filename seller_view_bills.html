<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generated Bills</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; background: #f8fafc; color: #102a43; margin: 0; }
  h1 { margin-top: 0; }
  .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
  button { background: #193f66; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #102a43; }
  .month-group { margin-top: 2rem; border-top: 1px solid #e2e8f0; padding-top: 1rem; }
  .month-group h2 { color: #334e68; font-size: 1.25rem; margin-bottom: 1rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
  li:last-child { border-bottom: none; }
  a { color: #0070f3; text-decoration: none; font-weight: 500; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .instructions { margin-bottom: 1.5rem; color: #475da7; font-size: 14px; background: #e0e7ff; padding: 1rem; border-radius: 4px; }
  #billIframe { width: 100%; height: 600px; border: 1px solid #e2e8f0; border-radius: 4px; margin-top: 2rem; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Generated Bills Archive</h1>
  <div class="instructions">
    To view your generated bills, click the button below and select your <strong>generated_bills</strong> folder.
    This works entirely in your browser.
  </div>
  <button id="openDirBtn">Open generated_bills Folder</button>
  
  <div id="billList"></div>
  <iframe id="billIframe"></iframe>
</div>

<script>
  document.getElementById('openDirBtn').addEventListener('click', async () => {
    try {
      const dirHandle = await window.showDirectoryPicker();
      let html = '';
      
      // Sort months descending
      let months = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'directory') {
          months.push({ name, handle });
        }
      }
      months.sort((a, b) => b.name.localeCompare(a.name));
      
      for (const month of months) {
        let bills = [];
        for await (const [billName, billHandle] of month.handle.entries()) {
          if (billName.endsWith('.html')) {
            bills.push({ name: billName, handle: billHandle });
          }
        }
        if (bills.length === 0) continue;
        
        bills.sort((a, b) => b.name.localeCompare(a.name)); // Sort newest first
        
        html += `<div class="month-group"><h2>${month.name}</h2><ul>`;
        for (const bill of bills) {
          html += `<li>
            <a href="#" class="view-bill" data-month="${month.name}" data-name="${bill.name}">${bill.name}</a>
          </li>`;
        }
        html += `</ul></div>`;
        
        // Store handles in a global map
        window.billHandles = window.billHandles || {};
        bills.forEach(b => {
          window.billHandles[`${month.name}/${b.name}`] = b.handle;
        });
      }
      
      if (!html) {
        html = '<p>No bills found in this folder.</p>';
      }
      
      document.getElementById('billList').innerHTML = html;
      document.getElementById('openDirBtn').textContent = 'Change Folder';
      
      // Add click listeners to links
      document.querySelectorAll('.view-bill').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          const key = `${e.target.dataset.month}/${e.target.dataset.name}`;
          const handle = window.billHandles[key];
          if (handle) {
            const file = await handle.getFile();
            const url = URL.createObjectURL(file);
            const iframe = document.getElementById('billIframe');
            iframe.src = url;
            iframe.style.display = 'block';
            iframe.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });
      
    } catch (err) {
      if (err.name !== 'AbortError') {
        alert('Error accessing folder: ' + err.message);
      }
    }
  });
</script>
</body>
</html>
